<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Brand Icon Group -->
  <g transform="translate(10, 8)">
    <!-- House outline -->
    <path class="house-roof" d="M32 6L6 28H14V58H50V28H58L32 6Z" fill="#0B5D43" stroke="#FAFBF8" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Worker 1 (Plumber/Technician with hard hat and wrench) -->
    <g class="worker-left" transform="translate(18, 30)">
      <circle cx="5" cy="5" r="3.5" fill="#FAFBF8"/>
      <path d="M1.5 5C1.5 3 3 1.5 5 1.5C7 1.5 8.5 3 8.5 5H1.5Z" fill="#F9B000"/>
      <path d="M1 18C1 13 3 11 5 11C7 11 9 13 9 18H1Z" fill="#FAFBF8"/>
      <!-- Small wrench -->
      <path d="M10 12L13 9M13 9L15 11M13 9L11 7" stroke="#F9B000" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Worker 2 (Electrician/Painter with cap and brush/gear) -->
    <g class="worker-right" transform="translate(32, 28)">
      <circle cx="5" cy="5" r="3.5" fill="#FAFBF8"/>
      <path d="M2 3.5C2 3.5 5 2 8 3.5L9 5H1L2 3.5Z" fill="#F9B000"/>
      <path d="M1 20C1 14.5 3 12 5 12C7 12 9 14.5 9 20H1Z" fill="#FAFBF8"/>
    </g>

    <!-- Glowing yellow window in roof/attic -->
    <rect class="window-glow" x="27" y="15" width="10" height="10" rx="2" fill="#F9B000" stroke="#FAFBF8" stroke-width="1.5"/>
    <path d="M32 15V25M27 20H37" stroke="#0B5D43" stroke-width="1.2"/>

    <!-- Golden yellow protective/cradling hand swooping up -->
    <path class="golden-hand" d="M4 52C8 46 16 44 26 46C36 48 42 54 52 50C56 48 58 44 60 41C61 40 62.5 40.5 62.2 41.8C61 47 56 57 48 59C38 61.5 24 60.5 14 57C9 55.5 5 53 4 52Z" fill="#F9B000"/>
    <!-- Gentle thumb / finger lines -->
    <path d="M46 51C49 48 53 46 56 47" stroke="#B88200" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 20)">
    <!-- "Home" in Dark Green Poppins Bold -->
    <text x="0" y="30" font-family="'Poppins', sans-serif" font-size="32" font-weight="800" fill="#0B5D43" letter-spacing="-0.5">Home<tspan fill="#F9B000">Crew</tspan></text>
    <!-- Tagline -->
    <text x="2" y="46" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#094E38" letter-spacing="1.2" text-transform="uppercase">Professional Hands in your Services</text>
  </g>
</svg>
